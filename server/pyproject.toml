[project]
name = "jobsync-server"
version = "0.1.0"
description = "JobSync intelligence layer — memory, retrieval, generation, traces"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Ingest. PyMuPDF is used at line granularity for column detection — see
    # app/ingest/columns.py, which depends on lines having tight bounding boxes.
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",  # UploadFile
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
